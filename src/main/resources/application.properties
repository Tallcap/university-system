spring.application.name=university-system

# ---- Base de datos SQL Server (cambia con variables de entorno o edita aquí) ----
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:UniversitySystem};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# update = Hibernate crea/ajusta las tablas solo (la BD debe existir: db/01_create_database.sql)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---- Gemini (opcional). Sin clave, la app arranca y las recomendaciones quedan en FAILED ----
gemini.api.key=${GEMINI_API_KEY:}

# 

# ---- API Inti (consulta de DNI). El token nunca debe guardarse en el código ----
apiinti.base-url=${APIINTI_BASE_URL:https://app.apiinti.dev/api/v1}
apiinti.token=${APIINTI_TOKEN:inti_live_e65e681e01a78af8668a19e226a052a9}
